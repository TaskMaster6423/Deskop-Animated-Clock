<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commander Clock v3.0</title>
    <style>
        /* --- CUSTOMIZATION SECTION START --- */
        :root {
            /* Default Theme (Cyber Green) - Will be overwritten by JS */
            --bg-color: #0f0f0f;
            --sidebar-bg: #1a1a1a;
            --accent-color: #00ffcc;
            
            --text-secondary: #888;
            --font-family: 'Courier New', monospace;
            --font-size: 80px;
            --column-width: 110px;
            --height: 100px;
            --swing-speed: 0.6s;
            --swing-type: cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        /* --- CUSTOMIZATION SECTION END --- */

        body {
            background-color: var(--bg-color);
            color: var(--accent-color);
            font-family: var(--font-family);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* --- CLOCK STYLES --- */
        .clock-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: margin-left 0.4s ease;
        }

        .clock-container {
            display: flex;
            gap: 20px;
            background: #000;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0, 0.5); /* Neutral shadow to work with all colors */
            position: relative;
            border: 1px solid #333;
        }

        .column-window {
            width: var(--column-width);
            height: var(--height);
            overflow: hidden;
            position: relative;
            background: #111;
            border-radius: 8px;
            border: 2px solid #333;
        }

        .number-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform var(--swing-speed) var(--swing-type);
            will-change: transform;
        }

        .number {
            height: var(--height);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: var(--font-size);
            font-weight: bold;
            text-shadow: 0 0 10px currentColor; /* Makes the text glow */
        }

        .label {
            font-size: 14px;
            text-align: center;
            color: var(--text-secondary);
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .ampm-box {
            position: absolute;
            right: -70px;
            bottom: 70px;
            font-size: 40px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            text-shadow: 0 0 10px currentColor;
        }

        .date-display {
            font-size: 24px;
            color: rgba(255,255,255,0.8);
            margin-top: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- SIDEBAR & NAVIGATION --- */
        .menu-btn {
            position: fixed;
            top: 20px; left: 20px;
            font-size: 30px;
            background: none; border: none;
            color: var(--accent-color);
            cursor: pointer; z-index: 100;
            transition: transform 0.3s, color 0.5s ease;
        }
        .menu-btn:hover { transform: scale(1.1); }

        .sidebar {
            position: fixed;
            top: 0; left: -320px;
            width: 300px; height: 100%;
            background-color: var(--sidebar-bg);
            border-right: 2px solid #333;
            padding: 20px;
            box-shadow: 5px 0 20px rgba(0,0,0,0.5);
            transition: left 0.4s ease, background-color 0.5s ease;
            z-index: 99;
            display: flex;
            flex-direction: column;
        }
        .sidebar.active { left: 0; }

        .sidebar h2 {
            margin-top: 50px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            font-size: 16px;
            color: #fff;
            letter-spacing: 1px;
        }

        .control-item {
            margin: 15px 0;
            display: flex; align-items: center; justify-content: space-between;
            color: #ddd; font-size: 16px;
        }

        /* Toggle Switch */
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .4s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 16px; width: 16px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent-color); }
        input:checked + .slider:before { transform: translateX(26px); }

        /* Links */
        .nav-links { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .nav-btn {
            background: #222; color: white; padding: 15px;
            text-decoration: none; border-radius: 8px; border: 1px solid #333;
            transition: 0.2s; display: flex; align-items: center; gap: 10px;
        }
        .nav-btn:hover { background: #333; border-color: var(--accent-color); }

        /* --- THEME SELECTOR --- */
        .theme-container {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            justify-content: center;
        }
        .theme-btn {
            width: 35px; height: 35px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .theme-btn:hover { transform: scale(1.2); }
        .theme-btn.active { border-color: white; transform: scale(1.1); }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 98;
            opacity: 0; pointer-events: none; transition: opacity 0.4s;
        }
        .overlay.active { opacity: 1; pointer-events: auto; }

    </style>
</head>
<body>

    <button class="menu-btn" onclick="toggleSidebar()">&#9776;</button>
    <div class="overlay" onclick="toggleSidebar()"></div>

    <nav class="sidebar" id="sidebar">
        <h2>DISPLAY</h2>
        
        <div class="control-item">
            <span>24-Hour Format</span>
            <label class="switch">
                <input type="checkbox" id="formatToggle" checked onchange="toggleFormat()">
                <span class="slider"></span>
            </label>
        </div>

        <h2>COLOR THEMES</h2>
        <div class="theme-container">
            <div class="theme-btn" style="background: #00ffcc;" onclick="setTheme('cyber')"></div>
            <div class="theme-btn" style="background: #ff0055;" onclick="setTheme('crimson')"></div>
            <div class="theme-btn" style="background: #00ccff;" onclick="setTheme('azure')"></div>
            <div class="theme-btn" style="background: #ffcc00;" onclick="setTheme('solar')"></div>
            <div class="theme-btn" style="background: #bd00ff;" onclick="setTheme('royal')"></div>
        </div>

        <h2>CALENDAR & TOOLS</h2>
        <div class="nav-links">
            <a href="ms-calendar:" class="nav-btn">
                <span>📅</span> System Calendar
            </a>
            <a href="https://calendar.google.com" target="_blank" class="nav-btn">
                <span>🌐</span> Google Calendar
            </a>
             <div class="nav-btn" style="cursor: default; opacity: 0.7;">
                <span>🔔</span> <span id="event-status">No urgent events</span>
            </div>
        </div>
        
        <div style="margin-top: auto; font-size: 12px; color: #555; text-align: center;">
            System v3.0 // Ready
        </div>
    </nav>

    <div class="clock-wrapper" id="main-content">
        <div class="clock-container">
            <div>
                <div class="column-window"><div class="number-strip" id="hours"></div></div>
                <div class="label">Hours</div>
            </div>
            <div>
                <div class="column-window"><div class="number-strip" id="minutes"></div></div>
                <div class="label">Mins</div>
            </div>
            <div>
                <div class="column-window"><div class="number-strip" id="seconds"></div></div>
                <div class="label">Secs</div>
            </div>
            <div class="ampm-box" id="ampm">AM</div>
        </div>
        <div class="date-display" id="date-display">LOADING DATE...</div>
    </div>

    <script>
        let is24Hour = true;
        const height = 100;

        // --- THEME ENGINE ---
        const themes = {
            cyber:   { accent: '#00ffcc', bg: '#0f0f0f', side: '#1a1a1a' },
            crimson: { accent: '#ff0055', bg: '#140505', side: '#1f0a0a' },
            azure:   { accent: '#00ccff', bg: '#051014', side: '#0a1a1f' },
            solar:   { accent: '#ffcc00', bg: '#141205', side: '#1f1c0a' },
            royal:   { accent: '#bd00ff', bg: '#100514', side: '#1a0a1f' }
        };

        function setTheme(themeName) {
            const t = themes[themeName];
            const root = document.documentElement;
            
            // Apply colors to CSS Variables
            root.style.setProperty('--accent-color', t.accent);
            root.style.setProperty('--bg-color', t.bg);
            root.style.setProperty('--sidebar-bg', t.side);

            // Visual feedback on buttons
            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
            // Find the button with matching color and add active class (simple matching)
            // (In a real app we'd add IDs to buttons, but this is lightweight)
            
            // Save to LocalStorage
            localStorage.setItem('clockTheme', themeName);
        }

        // Load saved theme on startup
        const savedTheme = localStorage.getItem('clockTheme') || 'cyber';
        setTheme(savedTheme);


        // --- CLOCK ENGINE ---
        const createStrip = (id, max, startFromOne = false) => {
            const strip = document.getElementById(id);
            let html = '';
            const start = startFromOne ? 1 : 0;
            for (let i = start; i <= max; i++) {
                let num = i < 10 ? '0' + i : i;
                html += `<div class="number">${num}</div>`;
            }
            strip.innerHTML = html;
        };

        createStrip('minutes', 59);
        createStrip('seconds', 59);
        
        function buildHourStrip() {
            if (is24Hour) { createStrip('hours', 23); } 
            else { createStrip('hours', 12, true); }
        }
        buildHourStrip();

        function updateClock() {
            const now = new Date();
            let h = now.getHours();
            const m = now.getMinutes();
            const s = now.getSeconds();
            
            const ampmEl = document.getElementById('ampm');
            let ampm = h >= 12 ? 'PM' : 'AM';
            let hIndex = h; 

            if (!is24Hour) {
                ampmEl.style.opacity = 1; 
                hIndex = h % 12; 
                if (hIndex === 0) hIndex = 12; 
                hIndex = hIndex - 1; 
                ampmEl.innerText = ampm;
            } else {
                ampmEl.style.opacity = 0; 
            }

            document.getElementById('hours').style.transform = `translateY(-${hIndex * height}px)`;
            document.getElementById('minutes').style.transform = `translateY(-${m * height}px)`;
            document.getElementById('seconds').style.transform = `translateY(-${s * height}px)`;

            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date-display').innerText = now.toLocaleDateString(undefined, dateOptions);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.querySelector('.overlay').classList.toggle('active');
        }

        function toggleFormat() {
            is24Hour = document.getElementById('formatToggle').checked;
            buildHourStrip(); 
            updateClock();    
        }

        updateClock();
        setInterval(updateClock, 1000);

    </script>
</body>
</html>
